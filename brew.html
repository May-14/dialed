<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew</title>
    <script src="./script/brew_script.js" defer></script>
</head>
<body>
    <h1>Brewing</h1>
    <div class="pre-brew-data">
        <h2>Pre brew data</h2>
        <div class="brew-settings">
            <h3>Brew settings</h3>
        </div>
        <div class="coffee-info">
            <h3>Coffee info</h3>
        </div>
        <div class="water-composition">
            <h3>Water composition</h3>
        </div>
        <div class="brew-preferences">
            <h3>Brew preferences</h3>
        </div>
        <button id="edit-brew-info">Edit</button>
    </div>
    <div class="brew-custimization">
        <h2>Customize brew</h2>
        <h3>Dose</h3>
        <form name="dose">
            <input type="range" id="dose" name="dose" min="15" max="20">
            <label for="dose">g</label>
        </form>
    </div>
</body>
</html>
